### Configuration file for Community Firn Model simulations

### ----------------- Processing forcing data ----------------- ###

## Directories
## Copy this file to config.yaml (which is gitignored) and edit the paths in this block for your machine:
##   cp config.example.yaml config.yaml
## Everything below this block is machine-independent and can usually be left as is.
## Paths may reference {cpom_mount}, which is expanded by src/cfm_config.py.
## Values starting with { must be quoted. Use absolute paths - ~ is not expanded.

# Where luna's CPOM share is mounted. On a Lancaster VM this is automatic at /home/<username>/luna/CPOM (see README).
cpom_mount: /home/<username>/luna/CPOM

# The CFM versions you can run, each a git checkout of https://github.com/UWGlaciology/CommunityFirnModel and the
# python to run it with. repo is the CFM_main folder, not the repo root. Pick one with run_cfm.py --cfm <label>.
# The label is only a name: each run's manifest records the measured commit and environment. A checkout with
# uncommitted .py changes is refused - commit local patches to a branch of the CFM checkout first.
cfm_versions:
  ab871c8:
    repo: /path/to/CommunityFirnModel/CFM_main
    python: /home/<username>/miniforge3/envs/cfm/bin/python
  # The one exception to the rule above: speersm's runs used 3e3bf7e plus an uncommitted SEB/melt patch, kept as is
  # so it reproduces them bit for bit (the reference test). Do not set allow_uncommitted on any other version.
  # 3e3bf7e-speersm:
  #   repo: /path/to/CommunityFirnModel-3e3bf7e/CFM_main
  #   python: /home/<username>/miniforge3/envs/cfm-3e3bf7e/bin/python
  #   allow_uncommitted: true
default_cfm_version: ab871c8

# Where all output goes (forcing CSVs, CFM results, figures): a local folder, or your own <username>/ folder on the share. Never under archive/.
CFM_data_path: /path/to/CFM_data

# Raw RCM NetCDF forcing data, read from the luna share. These defaults should work once cpom_mount is set.
MAR_data_path: "{cpom_mount}/briggsk/RCM_data/Data/MAR/AIS/27.5km" # MAR forcing data
RACMO_data_path: "{cpom_mount}/archive/MODELS/RCM/RACMO/AIS/Feb_2026/ANT-12/ERA5/evaluation/day" # RACMO forcing data
RACMO23_data_path: "{cpom_mount}/archive/MODELS/RCM/RACMO/AIS/Mar_2026" # higher resolution RACMO 2.3 forcing data

# In situ depth-density CSVs (the "profile" of each site in sites.yaml), used by scripts/plot_density_error.py
in_situ_data_path: "{cpom_mount}/hughes54/CFM_data/in_situ"

# Forcing cache (FEAT-002): one forcing CSV and JSON file for each RCM grid cell, shared by all CFM versions, at
# {forcing_data_path}/<rcm_name>/<release>/<i>_<j>_<start_year>_<end_year>.csv - optional, default below
forcing_data_path: "{CFM_data_path}/forcing"

# Period
start_year: 1979
end_year: 2024

# Site (a name in sites.yaml) at which scripts/run_cfm.py runs the CFM if no --site argument is passed
default_site: CI-0

# The sites (borehole locations with in situ measurements) and the batches are in sites.yaml (FEAT-002)

# bounding box for larsenC area
larsenC_box:
  lat_min: -75.0
  lat_max: -63.5
  lon_min: -75.0
  lon_max: -55.0

# RCM name to use for forcing data (e.g., MAR or RACMO)
rcm_name: RACMO23

## MAR Sector
sector: 1.0 # only take data from this sector in MAR files (think is ice vs non-ice)

## Mapping converting MAR columns to CFM input columns
MAR_to_CFM_column_map:
  TTZ: T2m # 2m above surface temperature
  TI1: TSKIN # surface temperature
  SU: SUBLIM # sublimation
  SHF: QH # sensible heat flux
  LHF: QL # latent heat flux
  SWD: SW_d # downward shortwave radiation
  LWD: LW_d # downward longwave radiation
  RF: RAIN # rainfall
  SF: BDOT # snowfall
  AL2: ALBEDO # surface albedo
  ME: SMELT # melt

## Mapping converting RACMO columns to CFM input columns
## Some columns are not 1-1, and should be calculated from the RACMO data
## e.g., rainfall can be calculated from total precipitation and snowfall
RACMO_to_CFM_column_map:
  tas: T2m # 2m above surface temperature
  ts: TSKIN # surface temperature
  sublgl: SUBLIM # sublimation
  hfssgl: QH # sensible heat flux
  hflsgl: QL # latent heat flux
  rsds: SW_d # downward shortwave radiation
  rlds: LW_d # downward longwave radiation
  rf: RAIN # rainfall - to be calculated as rf = pr - prsn, where pr is total precipitation and prsn is snowfall
  prsn: BDOT # snowfall
  alb: ALBEDO # surface albedo - to be calculated as alb = rsusgl / rsds, where rsusgl is upward shortwave radiation and rsds is downward shortwave radiation
  mltgl: SMELT # melt

# some change in variable names in the higher resolution (but older) RACMO 2.3 data, so need a separate mapping for that
RACMO23_to_CFM_column_map:
  tas: T2m # 2m above surface temperature
  ts: TSKIN # surface temperature
  subltot: SUBLIM # sublimation
  hfssgl: QH # sensible heat flux
  hflsgl: QL # latent heat flux
  rsds: SW_d # downward shortwave radiation
  rlds: LW_d # downward longwave radiation
  rf: RAIN # rainfall - to be calculated as rf = pr - prsn, where pr is total precipitation and prsn is snowfall
  sf: BDOT # snowfall
  alb: ALBEDO # surface albedo - to be calculated as alb = rsusgl / rsds, where rsusgl is upward shortwave radiation and rsds is downward shortwave radiation
  mltgl: SMELT # melt

## additional RACMO variables to read in to calculate CFM inputs
RACMO_additional_vars:
  - pr # total precipitation, used to calculate rainfall from pr - prsn
  - rsusgl # upward shortwave radiation, used to calculate albedo from rsugl / rsds

## smb to multiply by to convert RACMO to MAR units
RACMO_to_MAR_smb_factor: 86400 # RACMO outputs in kg/m2/s, MAR in kg/m2/day, so multiply by number of seconds (24 * 3600) in a day to convert
RACMO_var_to_multiply:
  - mltgl
  - sublgl
  - prsn

## temperature variables in MAR to convert to Kelvin
MAR_temp_vars:
  - TTZ
  - TI1

### ----------------- CFM Simulation ----------------- ###

## model run parameters
spin_end_year: 1989 #spin date end
runid: -9999 
rho_bottom: 910 # density at bottom boundary condition
sublim_sf: -1 #sublimation scaling factor, -1 for MERRA2 data, not sure for MAR data but think also -1, -1 for RACMO

