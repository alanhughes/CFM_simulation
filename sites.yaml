# Site table (FEAT-002). Git tracks this file, so all users have the same sites.
#
# A site is a location with in situ measurements. The CFM is forced with the data of one RCM grid cell, the model
# point of the site (src/force/model_point.py). Two sites in one grid cell share the forcing data and the CFM run.
#
# Keys of each site:
#   lat, lon       Site coordinates in degrees. Do not change them (see below). They must agree with sites.lock.
#   windows        Model time windows [first day, last day], both included, for the comparison with measurements.
#                  scripts/plot_density_error.py stops with an error for a site with no windows.
#   profile        Depth-density CSV in in_situ_data_path. Default: <site>_depth-density.csv.
#   active         false: the site is in the table, but sites() does not return it by default. Default: true.
#   superseded_by  The name of the site that replaces this one.
#
# Rule: the name, lat and lon of a site do not change. To correct the coordinates of a site, add a new site with a new
# name (for example JP21-v2), and set "active: false" and "superseded_by: JP21-v2" on the old site. Add each new site
# to sites.lock in the same commit. tests/test_sites.py enforces this rule.
#
# Caution: the windows are the austral summer windows that scripts/plot_density_error.py used before FEAT-002, by
# batch. The drill dates are not known yet. The batch_1 windows contain two summers. Make sure of the drill dates
# before you use the windows for results.

sites:
  CI-0:
    lat: -66.403
    lon: -63.376
    windows:
      - [2014-12-01, 2015-02-28]
      - [2015-12-01, 2016-02-29]
